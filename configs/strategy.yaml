# BTC Bot Multi-Timeframe Strategy Configuration
# ================================================
#
# This file defines trading configurations for multiple timeframes.
# Each config runs independently with its own capital, state, and ATH tracking.
#
# USAGE:
#   pnpm tsx scripts/setup-multi-config.ts configs/strategy.yaml
#
# OPTIONS:
#   --dry-run     Show what would happen without making changes
#   --reset       Also reset cycle states (create fresh cycles)
#
# CAPITAL ALLOCATION:
#   You can use either:
#   - capitalPct: Percentage of account balance (all configs must use this)
#   - capitalUsdt: Fixed USDT amount (all configs must use this)
#   Don't mix them - the bot will reject mixed allocation methods.
#
# TIMEFRAMES:
#   Valid values: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M
#   Each timeframe can only appear once across all active configs.
#
# BUY MODES:
#   arithmetic:     Grid-based with pre-calculated levels from ATH
#                   - Multiple buys can trigger in single candle
#                   - Grid rebuilds from anchor price after first buy
#
#   geom_modified:  Dynamic threshold from last buy price
#                   - Max 1 buy per candle
#                   - Each fill becomes anchor for next threshold
#                   - Better for volatile/fast timeframes
#
# PROFIT POOL (optional):
#   When enabled, profits from completed cycles are automatically managed:
#
#   HOW IT WORKS:
#   1. Cycle completes with profit (e.g., $100)
#   2. Profit is split: reinvestmentPercentage% to pool, rest to funding wallet
#   3. Reinvestment stays in pool until a NEW cycle is created
#   4. New cycle picks up its share (based on reinvestmentPct) → higher capital
#   5. Funding wallet amounts accumulate until >= minFundingTransferAmount
#
#   CONFIGURATION:
#   - pool.enabled: true/false - Enable/disable the feature
#   - pool.reinvestmentPercentage: % of profit to reinvest (0-100)
#   - pool.fundingWalletPercentage: % of profit to transfer out (0-100)
#   - pool.minFundingTransferAmount: Min USDT before Binance transfer triggers
#   - config.reinvestmentPct: Each config's share of pool (must sum to 100)
#
#   EXAMPLE FLOW:
#   - Config A (60% share) and Config B (40% share) are running
#   - Config A cycle closes with $100 profit
#   - $70 goes to reinvestment pool, $30 to funding wallet
#   - Config B creates new cycle → picks up $70 × 40% = $28 extra capital
#   - Config A creates new cycle → picks up remaining $42 extra capital
#
#   VALIDATION RULES:
#   - reinvestmentPercentage + fundingWalletPercentage must equal 100
#   - All active configs must have reinvestmentPct when pool is enabled
#   - Sum of all config reinvestmentPct values must equal 100
#
pool:
  enabled: true
  reinvestmentPercentage: 70   # 70% of profit to reinvestment pool
  fundingWalletPercentage: 30  # 30% of profit to funding wallet
  minFundingTransferAmount: 2 # Min USDT to trigger Binance transfer
#
# configs:
#   - timeframe: "1h"
#     reinvestmentPct: 60  # Gets 60% of pool's reinvestment
#     # ... other fields
#   - timeframe: "4h"
#     reinvestmentPct: 40  # Gets 40% of pool's reinvestment
#     # ... other fields

configs:
  # 5-minute: Aggressive scalping with tight thresholds
  # - timeframe: "5m"
  #   dropPct: 0.3
  #   risePct: 0.5
  #   maxPurchases: 12
  #   minBuyUsdt: 10
  #   athWindow: 25
  #   mode: "geom_modified"
  #   capitalPct: 20

  # 15-minute: Medium-term swing trading
  # - timeframe: "15m"
  #   dropPct: 0.6 # 2% drop
  #   risePct: 1 # 2% rise
  #   maxPurchases: 10
  #   minBuyUsdt: 15
  #   athWindow: 30 # 100 candles = ~25 hours
  #   mode: "geom_modified"
  #   capitalPct: 25

  # 1-hour: Standard swing trading
  - timeframe: "1h"
    dropPct: 1.2 # 3% drop
    risePct: 2 # 3% rise
    maxPurchases: 15
    minBuyUsdt: 33
    athWindow: 40 # 50 candles = ~2 days
    mode: "geom_modified" # Grid works well for slower timeframes
    capitalPct: 100
    reinvestmentPct: 100
  # - timeframe: "1h"
  #   dropPct: 1.2
  #   risePct: 2
  #   maxPurchases: 15
  #   minBuyUsdt: 40
  #   athWindow: 40
  #   mode: "geom_modified" # Grid works well for slower timeframes
  #   capitalPct: 15

  # 4-hour: Position trading
  # - timeframe: "4h"
