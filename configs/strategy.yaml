  #   risePct: 4
  #   maxPurchases: 15
  #   minBuyUsdt: 55.66
  #   athWindow: 25
  #   mode: "geom_modified"
  #   capitalPct: 25

  # 1 Day: Position trading
  # - timeframe: "1d"
